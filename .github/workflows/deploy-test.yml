name: PR Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/game-changes.yml

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_game_jobs == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Scala and SBT
        uses: olafurpg/setup-scala@v14

      - name: Build project
        run: sbt fullOptJS

      - name: Run tests
        run: sbt test balance/test

      - name: Setup Python for browser checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt

      - name: Check report and offline release packaging
        run: |
          python3 -m unittest discover -s tests -p "balance*_test.py"
          python3 -m unittest discover -s tests -p "package_site_test.py"

      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Check production UI on phone and desktop
        env:
          ANTIDLE_ARTIFACTS: test-results
          ANTIDLE_PRODUCTION: "1"
        run: |
          python3 tests/ci_browser_smoke.py
          python3 tests/map_browser_smoke.py
          python3 tests/offline_browser_smoke.py

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-failures
          path: test-results/
          if-no-files-found: ignore
