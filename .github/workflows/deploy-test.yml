name: PR Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/game-changes.yml

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_game_jobs == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Scala and SBT
        uses: olafurpg/setup-scala@v14

      - name: Build project
        run: sbt fullOptJS

      - name: Run tests
        run: sbt test
