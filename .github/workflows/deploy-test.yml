name: PR Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/game-changes.yml

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_game_jobs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup Scala and SBT
        timeout-minutes: 5
        uses: olafurpg/setup-scala@v14

      - name: Build project
        timeout-minutes: 10
        run: sbt fullOptJS

      - name: Run tests
        timeout-minutes: 10
        run: sbt test balance/test

      - name: Setup Python for browser checks
        timeout-minutes: 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt

      - name: Check report and offline release packaging
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s tests -p "balance*_test.py"
          python3 -m unittest discover -s tests -p "package_site_test.py"

      - name: Install browser test dependencies
        timeout-minutes: 8
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Check production UI on phone and desktop
        timeout-minutes: 5
        env:
          ANTIDLE_ARTIFACTS: test-results
        run: python3 tests/ci_browser_smoke.py

      - name: Check mobile navigation and resources
        timeout-minutes: 3
        env:
          ANTIDLE_PRODUCTION: "1"
        run: |
          python3 tests/mobile_navigation_smoke.py
          python3 tests/mobile_resources_smoke.py

      - name: Check stable brood layout
        timeout-minutes: 3
        env:
          ANTIDLE_PRODUCTION: "1"
        run: python3 tests/brood_layout_smoke.py

      - name: Check task controls
        timeout-minutes: 3
        run: python3 tests/task_controls_smoke.py

      - name: Check blocked-action feedback
        timeout-minutes: 3
        run: python3 tests/blocked_actions_smoke.py

      - name: Check exploration and trails on phone and desktop
        timeout-minutes: 5
        env:
          ANTIDLE_ARTIFACTS: test-results
          ANTIDLE_PRODUCTION: "1"
        run: python3 tests/map_browser_smoke.py

      - name: Check prestige and outer-map progression
        timeout-minutes: 5
        env:
          ANTIDLE_ARTIFACTS: test-results
          ANTIDLE_PRODUCTION: "1"
        run: python3 tests/prestige_smoke.py

      - name: Check offline play and updates
        timeout-minutes: 5
        env:
          ANTIDLE_ARTIFACTS: test-results
        run: python3 tests/offline_browser_smoke.py

      - name: Check preview save and worker isolation
        timeout-minutes: 3
        run: python3 tests/preview_browser_smoke.py

      - name: Upload browser failure screenshots
        timeout-minutes: 2
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-failures
          path: test-results/
          if-no-files-found: ignore

      - name: Package PR preview
        timeout-minutes: 2
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/package_site.py --out preview-site
          touch preview-site/.nojekyll
          echo "$PR_HEAD_SHA" > preview-site/preview-revision.txt

      - name: Upload PR preview
        timeout-minutes: 2
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: preview-site
          include-hidden-files: true
          retention-days: 3

  deploy-preview:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    environment:
      name: pr-${{ github.event.number }}
      url: https://rcmartins-apps.github.io/AntIdle/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Check PR is open and current
        id: pr
        timeout-minutes: 1
        uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
            core.setOutput('deploy', pr.state === 'open' && pr.head.sha === context.payload.pull_request.head.sha);
      - name: Checkout published branch
        if: steps.pr.outputs.deploy == 'true'
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Download static preview
        if: steps.pr.outputs.deploy == 'true'
        timeout-minutes: 2
        uses: actions/download-artifact@v4
        with:
          name: pr-preview
          path: preview-site
      - name: Publish preview
        if: steps.pr.outputs.deploy == 'true'
        timeout-minutes: 3
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: preview-site
          target-folder: pr-preview/pr-${{ github.event.number }}
      - name: Verify published preview
        if: steps.pr.outputs.deploy == 'true'
        timeout-minutes: 4
        env:
          PREVIEW_URL: https://rcmartins-apps.github.io/AntIdle/pr-preview/pr-${{ github.event.number }}/
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 18); do
            revision=$(curl -fsS --max-time 5 "${PREVIEW_URL}preview-revision.txt?revision=${PR_HEAD_SHA}" || true)
            if [ "$revision" = "$PR_HEAD_SHA" ] && curl -fsS --max-time 5 -o /dev/null "${PREVIEW_URL}"; then
              exit 0
            fi
            sleep 5
          done
          echo "Preview did not become available on GitHub Pages in time." >&2
          exit 1
      - name: Preview link
        if: steps.pr.outputs.deploy == 'true'
        timeout-minutes: 1
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "Preview — https://rcmartins-apps.github.io/AntIdle/pr-preview/pr-${PR_NUMBER}/" >> "$GITHUB_STEP_SUMMARY"
