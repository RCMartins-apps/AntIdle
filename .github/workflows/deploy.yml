name: Build and Deploy
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: >-
      ${{ github.event_name == 'push' ||
          (startsWith(github.head_ref, 'debug') &&
           github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/game-changes.yml

  build-and-deploy:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.run_game_jobs == 'true' &&
          (github.event_name == 'push' ||
          (startsWith(github.head_ref, 'debug') &&
           github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Setup Scala and SBT
        timeout-minutes: 5
        uses: olafurpg/setup-scala@v14

      - name: Build project
        timeout-minutes: 10
        run: sbt fullOptJS

      - name: Prepare files for GitHub Pages
        timeout-minutes: 2
        run: python3 scripts/package_site.py --out publish-folder

      - name: Deploy to GitHub Pages
        timeout-minutes: 5
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish-folder
