<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://use.fontawesome.com/releases/v6.4.2/css/all.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Ant Idle</title>
    <style>
        .antidle-app .resource-row { display: grid; grid-template-columns: minmax(0, 1fr) 7.5ch 6ch 7ch; align-items: center; column-gap: .35rem; row-gap: .125rem; margin: 0 0 .5rem; }
        .antidle-app .resource-row > div { width: auto; padding: 0; }
        .antidle-app .resource-timing { font-size: .75em; line-height: 1.3; white-space: normal; font-variant-numeric: tabular-nums; }
        .antidle-app .resource-amount { font-variant-numeric: tabular-nums; }
        .antidle-app .resource-label { display: inline-flex; align-items: center; gap: .35em; max-width: 100%; }
        .antidle-app .resource-label > span:last-child { min-width: 0; white-space: normal; }
        .antidle-app .resource-label .resource-icon { margin-inline-end: 0; }
        .antidle-app .resource-icon { display: inline-flex; width: 1.15em; height: 1.15em; margin-inline-end: .3em; vertical-align: -.2em; flex: 0 0 auto; }
        .antidle-app .resource-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
        .antidle-app .resource-icon-sugar { color: #98621b; }
        .antidle-app .resource-icon-protein { color: #b33e4c; }
        .antidle-app .resource-icon-resin { color: #ad6b00; }
        .antidle-app .resource-icon-knowledge { color: #355fc5; }
        .antidle-app .resource-icon-tunneling { color: #795b3c; }
        .antidle-app .resource-icon-workers { color: #495057; }
        .antidle-app .resource-icon-queens { color: #8159a6; }
        .antidle-app .resource-icon-scouts { color: #187563; }
        .antidle-app .resource-icon-eggs { color: #826227; }
        .antidle-app .resource-icon-colony { color: #7252a2; }
        .antidle-app .action-cost { display: inline-flex; align-items: baseline; }
        .antidle-app .upgrades-grid > .action-cell { align-content: start; }
        .antidle-app .action-cost .resource-icon { align-self: center; }
        .antidle-app .action-cost > span:last-child:not(.visually-hidden) { margin-inline-start: .25em; }
        .antidle-app .expedition-worker-stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: .5rem; max-width: 22rem; margin-bottom: .5rem; }
        .antidle-app .expedition-worker-stepper .btn,
        .antidle-app .expedition-worker-stepper input { min-height: 48px; min-width: 0; font-size: 1.125rem; }
        .antidle-app .mobile-only { display: none; }
        .antidle-app .game-tooltip { z-index: 1080; pointer-events: none; }

        .antidle-app .info-heading { position: relative; min-height: 44px; padding-right: 48px; margin-bottom: .25rem; }
        .antidle-app .info-heading > h5, .antidle-app .info-heading > h6, .antidle-app .info-heading > label { margin: 0; padding-top: .5rem; }
        .antidle-app .info-summary { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--bs-border-color); border-radius: .375rem; color: var(--bs-primary); cursor: pointer; list-style: none; touch-action: manipulation; }
        .antidle-app .info-summary::-webkit-details-marker { display: none; }
        .antidle-app .info-summary svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; }
        .antidle-app .info-summary:focus-visible { outline: 3px solid var(--bs-primary); outline-offset: 2px; }
        .antidle-app .info-details[open] > .info-summary { background: var(--bs-primary-bg-subtle); }
        .antidle-app .info-content { margin-top: .5rem; padding: .5rem; border: 1px solid var(--bs-border-color); border-radius: .375rem; font-size: .875rem; color: var(--bs-secondary-color); overflow-wrap: anywhere; }
        .antidle-app .info-content p:last-child { margin-bottom: 0; }
        .antidle-app .info-heading > .info-details > .info-summary { position: absolute; top: 0; right: 0; }
        .antidle-app .info-heading > .info-details > .info-content { margin-right: -48px; }
        .antidle-app .task-row { position: relative; min-height: 52px; padding-right: 48px; align-items: center; }
        .antidle-app .task-rate { flex: 0 0 100%; width: 100%; }
        .antidle-app .task-rate:empty { display: none; }
        .antidle-app .task-info { flex: 0 0 0; width: 0; height: 0; padding: 0; }
        .antidle-app .task-info:has(.info-details[open]) { flex: 0 0 100%; width: 100%; height: auto; padding: 0 .75rem; }
        .antidle-app .task-info .info-summary { position: absolute; top: 4px; right: 0; }
        .antidle-app .task-info .info-content { margin-right: -48px; }
        .antidle-app .action-cell { position: relative; }
        .antidle-app .action-cell:has(> .action-details) > button { margin-right: 3.5rem; }
        .antidle-app .action-details { margin: 0; }
        .antidle-app .action-details > summary { position: absolute; top: .5rem; right: .75rem; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 1px solid var(--bs-border-color); border-radius: .375rem; color: var(--bs-primary); background: var(--bs-body-bg); cursor: pointer; list-style: none; touch-action: manipulation; }
        .antidle-app .action-details > summary::-webkit-details-marker { display: none; }
        .antidle-app .action-details > summary:hover,
        .antidle-app .action-details[open] > summary { background: var(--bs-primary-bg-subtle); }
        .antidle-app .action-details > summary:focus-visible { outline: 3px solid var(--bs-primary); outline-offset: 2px; }
        .antidle-app .action-details > summary svg { display: block; width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
        .antidle-app .action-details > div { margin-top: .375rem; padding: .5rem !important; border: 1px solid var(--bs-border-color); border-radius: .375rem; font-size: .875rem; }

        /* Keep the desktop panels, but allow each one to fit narrower windows. */
        @media (max-width: 1874px) {
            .antidle-app .game-layout { align-items: flex-start; }
            .antidle-app .resources-column,
            .antidle-app .activity-column { width: 100%; min-width: 0; }
            .antidle-app .game-panel,
            .antidle-app .game-main { width: calc(100% - .5rem) !important; }
        }

        @media (max-width: 767px) {
            .antidle-app { font-size: 1rem; padding-bottom: env(safe-area-inset-bottom); }
            .antidle-app .game-layout { margin: .5rem !important; gap: .5rem; }
            .antidle-app .game-panel,
            .antidle-app .game-main { width: 100% !important; max-width: 100% !important; margin: 0 !important; }
            .antidle-app .game-main { min-width: 0; }
            .antidle-app .activity-column { display: grid; gap: .5rem; }
            .antidle-app .card-header { padding: .625rem .75rem; }
            .antidle-app .card-body { padding: .75rem; }
            .antidle-app .fs-4,
            .antidle-app .fs-5 { font-size: 1rem !important; }
            .antidle-app .btn { min-height: 44px; touch-action: manipulation; }
            .antidle-app .game-topbar > .m-2 > .d-flex { height: auto !important; min-height: 44px; gap: .5rem; flex-wrap: wrap; }
            .antidle-app .game-topbar > .m-2 > .d-flex > .d-flex { gap: .5rem; flex-wrap: wrap; }
            .antidle-app .game-topbar .topbar-spacer,
            .antidle-app .game-topbar > .m-2 > .d-flex > div:last-child { display: none; }
            .antidle-app .nav-tabs { flex-wrap: nowrap; overflow-x: auto; gap: .25rem; }
            .antidle-app .nav-tabs .nav-link { min-height: 44px; padding: .625rem .75rem; white-space: nowrap; }
            .antidle-app .nav-tabs .nav-item { flex-shrink: 0; }
            .antidle-app .mobile-only { display: block; }
            .antidle-app .batch-controls { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .75rem; padding-bottom: .75rem; border-bottom: 1px solid var(--bs-border-color); }
            .antidle-app .game-main:has(#settingsContent.active) .batch-controls,
            .antidle-app .game-main:has(#upgradesContent.active) .batch-controls { display: none; }
            .antidle-app .batch-controls small { font-size: .75rem; }
            .antidle-app .batch-controls .form-select { width: auto; min-height: 44px; }
            .antidle-app .action-cell,
            .antidle-app #settingsContent .col-6 { width: 100%; padding: .5rem .75rem !important; }
            .antidle-app #settingsContent .justify-content-between { flex-wrap: wrap; gap: .5rem; }
            .antidle-app .resource-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: baseline; column-gap: .35rem; row-gap: .125rem; margin: 0 0 .5rem; }
            .antidle-app .resource-row > div { width: auto; padding: 0; }
            .antidle-app .resource-row > div:first-child { grid-column: 1; grid-row: 1 / span 2; align-self: start; white-space: normal !important; overflow-wrap: anywhere; }
            .antidle-app .resource-row > div:last-child { grid-column: 2 / -1; grid-row: 2; font-size: .875rem; color: var(--bs-secondary-color); }
            .antidle-app .task-row { align-items: center; row-gap: .5rem; }
            .antidle-app .task-row > .col-6 { flex: 1; min-width: 0; }
            .antidle-app .task-controls { width: auto; display: flex; padding-left: 0; }
            .antidle-app .task-controls .btn { min-width: 44px; }
            .antidle-app .build-task { display: block; min-height: 44px; padding: .625rem 0; cursor: pointer; }
            .antidle-app #exploreContent .col-6 { width: 100%; }
            .antidle-app .exploration-destination:not(.destination-selected) { display: none; }
            .antidle-app .expedition-setup .expedition-worker-stepper { max-width: none; margin-bottom: .35rem; }
            .antidle-app .destination-carousel { display: flex; align-items: center; gap: .5rem; margin-bottom: .25rem; }
            .antidle-app .destination-carousel .btn { flex: 0 0 44px; font-size: 1.5rem; line-height: 1; }
            .antidle-app .carousel-caption-text { flex: 1; min-width: 0; text-align: center; }
            .antidle-app .carousel-destination-name { font-weight: 600; }
            .antidle-app .exploration-destination { touch-action: pan-y pinch-zoom; }
            .antidle-app .worker-presets .btn { flex: 1; padding-left: .35rem; padding-right: .35rem; }
            .antidle-app .expedition-setup { padding-bottom: .25rem !important; }
            .antidle-app .exploration-destination.destination-selected { padding-top: .25rem !important; }

            .antidle-app .form-range { min-height: 44px; }
            .antidle-app .game-tooltip { display: none !important; }
            .antidle-app .alert { width: calc(100% - 1rem); max-width: 28rem; position: fixed !important; z-index: 1090; }
            .antidle-app .modal-dialog { margin: .5rem; }
            .antidle-app .modal-content { max-height: calc(100dvh - 1rem); overflow-y: auto; }
            .antidle-app textarea { min-width: 0; width: 100%; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script src="https://code.jquery.com/jquery-2.2.4.min.js" integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@popperjs/core@2"></script>

<script type="text/javascript" src="target/scala-2.13/antidle-fastopt/main.js"></script>

</body>
</html>
